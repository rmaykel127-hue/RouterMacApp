name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto ZIP
        run: |
          mkdir proyecto
          unzip -q RouterMacApp_compilable.zip -d proyecto

      - name: Buscar Gradle
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew dentro del ZIP"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/build/outputs/apk/**/*.apk'
