name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto ZIP
        run: |
          mkdir proyecto
          unzip -q RouterMacApp_compilable.zip -d proyecto

      - name: Revisar contenido del ZIP
        run: |
          echo "=== CONTENIDO DEL ZIP ==="
          find proyecto -maxdepth 5 -type f | sort
          echo "=== ARCHIVOS GRADLE ==="
          find proyecto -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
